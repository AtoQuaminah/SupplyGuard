[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplyguard"
version = "0.1.0"
description = "Security-oriented static scanner for Python package artifacts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SupplyGuard" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
supplyguard = "supplyguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
